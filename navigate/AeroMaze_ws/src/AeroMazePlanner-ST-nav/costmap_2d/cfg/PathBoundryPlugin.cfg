#!/usr/bin/env python

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, bool_t, double_t

gen = ParameterGenerator()

gen.add("enabled", bool_t, 0, "Whether to apply this plugin or not", True)
gen.add("use_dynamic_radius", bool_t, 0, "", False)
gen.add("inflation_radius", double_t, 0, "The radius in meters to which the map inflates obstacle cost values.", 1.5, 0, 50)
gen.add("max_inflation_radius", double_t, 0, "The radius in meters to which the map inflates obstacle cost values.", 1.5, 0, 50)

exit(gen.generate("costmap_2d", "costmap_2d", "PathBoundryPlugin"))
