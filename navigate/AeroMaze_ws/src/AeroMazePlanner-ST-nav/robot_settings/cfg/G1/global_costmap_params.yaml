global_costmap:
  global_frame: map
  robot_base_frame: base_link
  update_frequency: 3.0
  publish_frequency: 3.0
  footprint_padding: 0.05
  plugins:
    - {name: static_layer, type: "costmap_2d::StaticLayer"}
    - {name: obstacle_layer, type: "costmap_2d::ObstacleLayer"}
    - {name: inflation_layer, type: "costmap_2d::InflationLayer"}
    - {name: path_boundry, type: "costmap_2d::PathBoundryLayer"}

  static_layer:
    enabled:              true
    map_topic:            /map
    use_maximum:          true

  obstacle_layer:
    enabled: true
    clear_on_update: true
    # 障碍源用 3D 点云而非 /scan：/scan 的高度切片在雷达系里做，走路俯仰(实测到
    # +12°)会把地面扫进去(bag 实测旧切片 12.5% 是地面点)。costmap 的
    # min/max_obstacle_height 在本图 global_frame(map，重力对齐)里过滤，
    # 地面恒在 z=-1.2 不随俯仰动。带 [-0.9, 0.15] = 离地 0.3~1.35m。
    observation_sources: cloud
    cloud:
      data_type: PointCloud2
      topic: /base_link_cloud
      marking: true
      clearing: true
      observation_persistence: 2.0   # 10.0 会让偶发假障碍黏 10 秒
      expected_update_rate: 0.0
      obstacle_range: 2.5
      raytrace_range: 3.0
      min_obstacle_height: -0.9
      max_obstacle_height: 0.15

  inflation_layer:
    cost_scaling_factor:  5.0
    inflation_radius:     0.5

  path_boundry:
    enabled: true
    path_topic: /path_boundry_path
    use_dynamic_radius: false
    inflation_radius: 1.0
    max_inflation_radius: 1.0
