DWAPlannerROS:

# Robot Configuration Parameters
  max_vel_x: 2.0
  min_vel_x: 0.0

  max_vel_y: 0.0
  min_vel_y: 0.0

# The velocity when robot is moving in a straight line
  max_vel_trans:  2.0
  min_vel_trans:  0.0

  max_vel_theta: 2.75
  min_vel_theta: 0.3

  acc_lim_x: 2.5
  acc_lim_y: 0.0
  acc_lim_theta: 3.2 

# Goal Tolerance Parameters
  xy_goal_tolerance: 0.05
  yaw_goal_tolerance: 0.17
  latch_xy_goal_tolerance: true

# Initial Path Alignment
  enable_initial_path_alignment: true
  initial_alignment_tolerance: 0.17
  initial_alignment_min_path_length: 0.2
  initial_alignment_new_goal_dist: 0.2
  initial_alignment_new_goal_yaw: 0.35

# Forward Simulation Parameters
  sim_time: 1.0
  sim_granularity: 0.03
  angular_sim_granularity: 0.1
  vx_samples: 20
  vy_samples: 0
  vth_samples: 40
  controller_frequency: 10.0

# Trajectory Scoring Parameters
  path_distance_bias: 48.0
  goal_distance_bias: 12.0
  occdist_scale: 0.02
  forward_point_distance: 0.45
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2

# Oscillation Prevention Parameters
  oscillation_reset_dist: 0.05

# Debugging
  publish_traj_pc : true
  publish_cost_grid_pc: true
